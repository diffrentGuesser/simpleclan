name: Update download from jars/

# When a new simple-clan-<version>.jar is pushed into jars/, promote it to the
# site's download and update the version shown, then commit the change. GitHub
# Pages redeploys automatically on the commit.
on:
  push:
    paths:
      - "jars/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-download
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Promote newest jar and update the page
        run: python tools/update_download.py

      - name: Commit the update
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update download to the jar in jars/"
          git push
